<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Beaumarchais — Frise chronologique</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link title="timeline-styles" rel="stylesheet" href="https://cdn.knightlab.com/libs/timeline3/latest/css/timeline.css">

<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body { margin: 0; padding: 0; height: 100%; font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; background: #fff; }
  #app { display: flex; flex-direction: column; height: 100%; }
  #timeline-embed { flex: 1 1 auto; width: 100%; min-height: 0; }

  #goto-bar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    padding-top: calc(8px + env(safe-area-inset-top, 0px));
    background: #222;
    color: #fff;
    font-size: 14px;
    z-index: 20;
  }
  #goto-bar label { white-space: nowrap; }
  #goto-year {
    width: 90px;
    padding: 4px 6px;
    border-radius: 4px;
    border: 1px solid #888;
    font-size: 14px;
  }
  #goto-btn {
    padding: 4px 12px;
    border-radius: 4px;
    border: none;
    background: #c0392b;
    color: #fff;
    cursor: pointer;
    font-size: 14px;
  }
  #goto-btn:hover { background: #a93226; }
  #goto-msg { font-size: 12px; color: #ccc; }

  .tl-timenav .tl-timegroup:nth-of-type(1) .tl-timemarker,
  .tl-timenav .tl-timegroup:nth-of-type(1) .tl-timemarker-content-container {
    background-color: #c0392b !important;
    border-color: #c0392b !important;
  }
  .tl-timenav .tl-timegroup:nth-of-type(1) .tl-timegroup-message {
    color: #c0392b !important;
  }
  .tl-timenav .tl-timegroup:nth-of-type(2) .tl-timemarker,
  .tl-timenav .tl-timegroup:nth-of-type(2) .tl-timemarker-content-container {
    background-color: #e8a3c0 !important;
    border-color: #e8a3c0 !important;
  }
  .tl-timenav .tl-timegroup:nth-of-type(2) .tl-timegroup-message {
    color: #d16ba0 !important;
  }

  @media (max-width: 480px) {
    #goto-bar { flex-wrap: wrap; }
  }
</style>
</head>

<script type="text/javascript">
  var timeline_json = {"title": {"text": {"headline": "Beaumarchais (1732–1799)", "text": "<p>Frise complète — jalons majeurs de la vie de Beaumarchais, détails biographiques, et grand contexte historique.</p>"}}, "eras": [{"start_date": {"year": 1756}, "end_date": {"year": 1763}, "text": {"headline": "Guerre de Sept Ans"}}, {"start_date": {"year": 1775}, "end_date": {"year": 1783}, "text": {"headline": "Guerre d'indépendance américaine"}}, {"start_date": {"year": 1789}, "end_date": {"year": 1799, "month": 11}, "text": {"headline": "Révolution française"}}], "events": [{"start_date": {"year": 1732, "month": 1, "day": 24}, "text": {"headline": "Naissance de Pierre-Augustin Caron (futur Beaumarchais)", "text": "<p>Il naît rue Saint-Denis à Paris ; baptisé le lendemain à Saint-Jacques-de-la-Boucherie.</p>"}, "group": "Vie – jalons majeurs", "unique_id": "e0"}, {"start_date": {"year": 1742}, "text": {"headline": "Formation à l'école des métiers d'Alfort puis chez son père", "text": "<p>Il y apprend l'horlogerie ainsi que la musique et la poésie.</p>"}, "group": "Vie – jalons majeurs", "display_date": "1742-1745", "unique_id": "e1"}, {"start_date": {"year": 1753}, "text": {"headline": "Invente un nouveau système d'échappement", "text": "<p>L'horloger du roi, Lepaute, présente cette invention comme sienne à l'Académie des sciences.</p>"}, "group": "Vie – jalons majeurs", "display_date": "1753", "unique_id": "e2"}, {"start_date": {"year": 1754, "month": 2, "day": 23}, "text": {"headline": "L'Académie reconnaît Beaumarchais comme l'inventeur", "text": "<p>Désormais connu, il reçoit des commandes pour la cour et est présenté au roi et à la reine.</p>"}, "group": "Vie – jalons majeurs", "unique_id": "e3"}, {"start_date": {"year": 1755, "month": 11, "day": 9}, "text": {"headline": "Beaumarchais obtient une charge à la Maison du roi", "text": "<p>Transfert de la charge de contrôleur clerc d'office par Pierre-Augustin Franquet.</p>"}, "group": "Vie – jalons majeurs", "unique_id": "e4"}, {"start_date": {"year": 1756, "month": 11, "day": 27}, "text": {"headline": "Beaumarchais épouse Madeleine-Catherine Aubertin, veuve Franquet", "text": ""}, "group": "Vie – jalons majeurs", "unique_id": "e5"}, {"start_date": {"year": 1757}, "text": {"headline": "Il prend le nom de « Caron de Beaumarchais »", "text": "<p>Du nom d'une terre héritée par sa femme.</p>"}, "group": "Vie – jalons majeurs", "display_date": "1757", "unique_id": "e6"}, {"start_date": {"year": 1757}, "text": {"headline": "Débuts d'auteur dramatique auprès de Le Normant d'Étiolles", "text": "<p>Il écrit ses premières parades pour le petit théâtre du mari de la marquise de Pompadour.</p>"}, "group": "Vie – jalons majeurs", "display_date": "1757 ou 1758", "unique_id": "e7"}, {"start_date": {"year": 1757, "month": 11, "day": 30}, "text": {"headline": "Mort de sa femme : Beaumarchais ruiné", "text": "<p>Le contrat de mariage n'ayant pas été « insinué » à temps, il ne peut hériter et se retrouve accablé de dettes.</p>"}, "group": "Vie – jalons majeurs", "display_date": "Nuit du 29 au 30 novembre 1757", "unique_id": "e8"}, {"start_date": {"year": 1759}, "text": {"headline": "Devient indispensable auprès de Mesdames, filles du roi", "text": "<p>Leçons de musique et de harpe ; il rencontre vers cette époque le financier Pâris-Duverney.</p>"}, "group": "Vie – jalons majeurs", "display_date": "1759", "unique_id": "e9"}, {"start_date": {"year": 1760, "month": 8, "day": 18}, "text": {"headline": "Fait visiter l'École militaire au roi", "text": "<p>Pâris-Duverney, reconnaissant, associe Beaumarchais à ses affaires et l'enrichit considérablement.</p>"}, "group": "Vie – jalons majeurs", "unique_id": "e10"}, {"start_date": {"year": 1761, "month": 12}, "text": {"headline": "Achète la charge de conseiller secrétaire du roi", "text": "<p>Cette charge, financée en grande partie par Pâris-Duverney, l'anoblit et lui permet de porter légalement le nom de Beaumarchais.</p>"}, "group": "Vie – jalons majeurs", "display_date": "Décembre 1761", "unique_id": "e11"}, {"start_date": {"year": 1764, "month": 4, "day": 20}, "text": {"headline": "Départ pour l'Espagne", "text": "<p>Mission pour marier sa sœur Lisette et régler des dettes considérables.</p>"}, "group": "Vie – jalons majeurs", "unique_id": "e12"}, {"start_date": {"year": 1765, "month": 3, "day": 22}, "text": {"headline": "Quitte Madrid : échec de ses missions espagnoles", "text": "<p>Choiseul, insatisfait de son agent, n'a pas obtenu les résultats espérés.</p>"}, "group": "Vie – jalons majeurs", "unique_id": "e13"}, {"start_date": {"year": 1767, "month": 1, "day": 29}, "text": {"headline": "Première d'Eugénie à la Comédie-Française", "text": "<p>Son premier drame sérieux ; à peine un demi-succès.</p>"}, "group": "Vie – jalons majeurs", "unique_id": "e14"}, {"start_date": {"year": 1768, "month": 4, "day": 11}, "text": {"headline": "Mariage avec Geneviève-Madeleine Wattebled", "text": ""}, "group": "Vie – jalons majeurs", "unique_id": "e15"}, {"start_date": {"year": 1768, "month": 12, "day": 14}, "text": {"headline": "Naissance de son fils Augustin de Beaumarchais", "text": ""}, "group": "Vie – jalons majeurs", "unique_id": "e16"}, {"start_date": {"year": 1770, "month": 1, "day": 13}, "text": {"headline": "Première des Deux Amis : échec total", "text": "<p>Dix représentations seulement.</p>"}, "group": "Vie – jalons majeurs", "unique_id": "e17"}, {"start_date": {"year": 1770, "month": 7, "day": 17}, "text": {"headline": "Mort de Pâris-Duverney, son protecteur", "text": "<p>Décès à quatre-vingt-six ans, ce qui va priver Beaumarchais d'un appui décisif.</p>"}, "group": "Vie – jalons majeurs", "unique_id": "e18"}, {"start_date": {"year": 1770, "month": 11, "day": 20}, "text": {"headline": "Mort de sa seconde femme", "text": "<p>Sa fortune, en viager, échappe à Beaumarchais.</p>"}, "group": "Vie – jalons majeurs", "unique_id": "e19"}, {"start_date": {"year": 1771}, "text": {"headline": "Le Barbier de Séville (1ère version) refusé par les Comédiens Italiens", "text": ""}, "group": "Vie – jalons majeurs", "display_date": "1771", "unique_id": "e20"}, {"start_date": {"year": 1771, "month": 10}, "text": {"headline": "Début du procès avec le comte de La Blache", "text": "<p>La Blache, héritier de Pâris-Duverney, conteste l'arrêté de compte entre son oncle et Beaumarchais.</p>"}, "group": "Vie – jalons majeurs", "display_date": "Octobre 1771", "unique_id": "e21"}, {"start_date": {"year": 1772, "month": 2, "day": 22}, "text": {"headline": "Beaumarchais gagne son procès contre La Blache en première instance", "text": "<p>Son adversaire fait appel devant le parlement de Paris.</p>"}, "group": "Vie – jalons majeurs", "unique_id": "e22"}, {"start_date": {"year": 1772, "month": 10, "day": 17}, "text": {"headline": "Mort de son fils Augustin", "text": "<p>À l'âge de trois ans et huit mois.</p>"}, "group": "Vie – jalons majeurs", "unique_id": "e23"}, {"start_date": {"year": 1773, "month": 2, "day": 11}, "text": {"headline": "Altercation avec le duc de Chaulnes", "text": "<p>Le duc, qui accuse Beaumarchais de lui ravir sa maîtresse, est emprisonné le 19 à Vincennes.</p>"}, "group": "Vie – jalons majeurs", "display_date": "11-19 février 1773", "unique_id": "e24"}, {"start_date": {"year": 1773, "month": 2, "day": 26}, "text": {"headline": "Incarcération de Beaumarchais", "text": ""}, "group": "Vie – jalons majeurs", "display_date": "26 février - 8 mai 1773", "unique_id": "e25"}, {"start_date": {"year": 1773, "month": 4, "day": 6}, "text": {"headline": "Beaumarchais perd son procès contre La Blache : quasi-ruine", "text": "<p>Sur rapport défavorable du conseiller Goëzman.</p>"}, "group": "Vie – jalons majeurs", "unique_id": "e26"}, {"start_date": {"year": 1773, "month": 7, "day": 10}, "text": {"headline": "Beaumarchais décrété « d'ajournement personnel »", "text": ""}, "group": "Vie – jalons majeurs", "unique_id": "e27"}, {"start_date": {"year": 1773, "month": 9}, "text": {"headline": "Publication des trois premiers Mémoires contre Goëzman", "text": ""}, "group": "Vie – jalons majeurs", "display_date": "Septembre-décembre 1773", "unique_id": "e28"}, {"start_date": {"year": 1774}, "text": {"headline": "Rencontre avec Marie-Thérèse de Willermaulaz", "text": "<p>Il vivra désormais avec elle, mais ne l'épousera qu'en 1786.</p>"}, "group": "Vie – jalons majeurs", "display_date": "Début 1774", "unique_id": "e29"}, {"start_date": {"year": 1774, "month": 2, "day": 10}, "text": {"headline": "Publication du quatrième Mémoire contre Goëzman", "text": "<p>Cette publication entraîne l'interdiction de représenter Le Barbier de Séville.</p>"}, "group": "Vie – jalons majeurs", "unique_id": "e30"}, {"start_date": {"year": 1774, "month": 2, "day": 26}, "text": {"headline": "Arrêt Goëzman : Beaumarchais blâmé, perte de ses droits civils", "text": ""}, "group": "Vie – jalons majeurs", "unique_id": "e31"}, {"start_date": {"year": 1774, "month": 3}, "text": {"headline": "Premier séjour à Londres pour Louis XV", "text": "<p>Il obtient du libelliste Morande la destruction d'un libelle contre la comtesse Du Barry.</p>"}, "group": "Vie – jalons majeurs", "display_date": "Mars-mai 1774", "unique_id": "e32"}, {"start_date": {"year": 1774, "month": 8}, "text": {"headline": "Mission à Vienne : retenu prisonnier à la cour", "text": "<p>Poursuivant Angelucci, auteur d'un pamphlet contre Marie-Antoinette.</p>"}, "group": "Vie – jalons majeurs", "display_date": "Août-23 septembre 1774", "unique_id": "e33"}, {"start_date": {"year": 1775}, "text": {"headline": "Début de la correspondance avec Vergennes", "text": "<p>Elle se poursuivra jusqu'à la mort du ministre en 1787.</p>"}, "group": "Vie – jalons majeurs", "display_date": "1775", "unique_id": "e34"}, {"start_date": {"year": 1775, "month": 2, "day": 26}, "text": {"headline": "Triomphe du Barbier de Séville", "text": "<p>Réduite à quatre actes après l'échec du 23 février, la pièce triomphe enfin.</p>"}, "group": "Vie – jalons majeurs", "unique_id": "e35"}, {"start_date": {"year": 1775, "month": 8}, "text": {"headline": "Premiers Mémoires au roi sur l'aide à apporter aux insurgés américains", "text": ""}, "group": "Vie – jalons majeurs", "display_date": "Dès août 1775", "unique_id": "e36"}, {"start_date": {"year": 1776, "month": 2}, "text": {"headline": "Mémoire « au Roi seul » sur l'Angleterre et l'Amérique", "text": ""}, "group": "Vie – jalons majeurs", "display_date": "Fin février 1776", "unique_id": "e37"}, {"start_date": {"year": 1776, "month": 6, "day": 10}, "text": {"headline": "Fondation de Roderigue Hortalez et Cie", "text": "<p>Beaumarchais reçoit un million de livres du Trésor, via Vergennes, pour financer secrètement les insurgés américains.</p>"}, "group": "Vie – jalons majeurs", "unique_id": "e38"}, {"start_date": {"year": 1776, "month": 7}, "text": {"headline": "Silas Deane, envoyé du Congrès américain, orienté vers Beaumarchais", "text": "<p>Vergennes lui refuse des armes officiellement, mais l'envoie négocier avec Beaumarchais.</p>"}, "group": "Vie – jalons majeurs", "display_date": "Juillet 1776", "unique_id": "e39"}, {"start_date": {"year": 1776, "month": 9, "day": 6}, "text": {"headline": "Beaumarchais réhabilité dans tous ses droits", "text": "<p>Un arrêt du Parlement annule le jugement de 1774.</p>"}, "group": "Vie – jalons majeurs", "unique_id": "e40"}, {"start_date": {"year": 1777, "month": 1, "day": 5}, "text": {"headline": "Naissance de sa fille Eugénie de Beaumarchais", "text": ""}, "group": "Vie – jalons majeurs", "unique_id": "e41"}, {"start_date": {"year": 1777, "month": 6}, "text": {"headline": "Vergennes finance l'équipement des insurgés d'Amérique via Beaumarchais", "text": ""}, "group": "Vie – jalons majeurs", "display_date": "Juin-juillet 1777", "unique_id": "e42"}, {"start_date": {"year": 1777, "month": 7, "day": 3}, "text": {"headline": "Réunion fondatrice de la Société des auteurs dramatiques", "text": "<p>Beaumarchais réunit chez lui vingt-trois auteurs mécontents de leur sort face aux Comédiens-Français.</p>"}, "group": "Vie – jalons majeurs", "unique_id": "e43"}, {"start_date": {"year": 1777, "month": 10, "day": 26}, "text": {"headline": "Remise du Mémoire particulier pour les ministres du Roi", "text": "<p>Texte influent, remis à Vergennes, dont le gouvernement va s'inspirer.</p>"}, "group": "Vie – jalons majeurs", "unique_id": "e44"}, {"start_date": {"year": 1778}, "text": {"headline": "Le Mariage de Figaro est terminé", "text": ""}, "group": "Vie – jalons majeurs", "display_date": "1778", "unique_id": "e45"}, {"start_date": {"year": 1778, "month": 4, "day": 16}, "text": {"headline": "Contrat avec les Américains pour le paiement des fournitures", "text": "<p>Signé après le traité d'amitié franco-américain du 6 février ; les Américains ne l'honoreront jamais.</p>"}, "group": "Vie – jalons majeurs", "unique_id": "e46"}, {"start_date": {"year": 1778, "month": 7, "day": 21}, "text": {"headline": "Le parlement d'Aix rend un arrêt favorable dans l'affaire La Blache", "text": ""}, "group": "Vie – jalons majeurs", "unique_id": "e47"}, {"start_date": {"year": 1779}, "text": {"headline": "Début de l'édition des œuvres de Voltaire", "text": "<p>Cette année marque aussi le début de sa « disgrâce » à Versailles.</p>"}, "group": "Vie – jalons majeurs", "display_date": "1779", "unique_id": "e48"}, {"start_date": {"year": 1779, "month": 7, "day": 6}, "text": {"headline": "« Le Fier Roderigue » s'illustre à la reprise de la Grenade puis est détruit", "text": ""}, "group": "Vie – jalons majeurs", "unique_id": "e49"}, {"start_date": {"year": 1779, "month": 7, "day": 23}, "text": {"headline": "Beaumarchais retrouve sa charge de secrétaire du roi", "text": "<p>Un arrêt du Parlement casse le décret d'ajournement personnel de 1773.</p>"}, "group": "Vie – jalons majeurs", "unique_id": "e50"}, {"start_date": {"year": 1780, "month": 12, "day": 9}, "text": {"headline": "Arrêt du Conseil d'État fixant les droits des auteurs dramatiques", "text": ""}, "group": "Vie – jalons majeurs", "unique_id": "e51"}, {"start_date": {"year": 1780, "month": 12, "day": 18}, "text": {"headline": "Mise au point du projet de l'édition de Kehl des œuvres de Voltaire", "text": ""}, "group": "Vie – jalons majeurs", "unique_id": "e52"}, {"start_date": {"year": 1781, "month": 1}, "text": {"headline": "Parution du prospectus de souscription de l'édition de Kehl", "text": ""}, "group": "Vie – jalons majeurs", "display_date": "Janvier 1781", "unique_id": "e53"}, {"start_date": {"year": 1781, "month": 9, "day": 29}, "text": {"headline": "Le Mariage de Figaro reçu à l'unanimité à la Comédie-Française", "text": ""}, "group": "Vie – jalons majeurs", "unique_id": "e54"}, {"start_date": {"year": 1781, "month": 10}, "text": {"headline": "Début de l'affaire Kornman", "text": "<p>Beaumarchais décide de défendre Mme Kornman, persécutée par son mari banquier.</p>"}, "group": "Vie – jalons majeurs", "display_date": "Octobre 1781", "unique_id": "e55"}, {"start_date": {"year": 1782}, "text": {"headline": "Défense publique du Mariage de Figaro", "text": "<p>Des lectures se succèdent dans les salons, notamment devant le grand-duc de Russie.</p>"}, "group": "Vie – jalons majeurs", "display_date": "Début 1782", "unique_id": "e56"}, {"start_date": {"year": 1783}, "text": {"headline": "Publication des premiers volumes de l'édition de Voltaire", "text": ""}, "group": "Vie – jalons majeurs", "display_date": "1783", "unique_id": "e57"}, {"start_date": {"year": 1783, "month": 3}, "text": {"headline": "Grosses difficultés financières résolues par le gouvernement", "text": "<p>Après une lettre à Vergennes, le gouvernement verse à Beaumarchais plus de neuf cent mille livres.</p>"}, "group": "Vie – jalons majeurs", "display_date": "Mars-avril 1783", "unique_id": "e58"}, {"start_date": {"year": 1783, "month": 6, "day": 13}, "text": {"headline": "Le Mariage de Figaro interdit au dernier moment par le roi", "text": ""}, "group": "Vie – jalons majeurs", "unique_id": "e59"}, {"start_date": {"year": 1783, "month": 9, "day": 26}, "text": {"headline": "Représentation privée du Mariage de Figaro à Gennevilliers", "text": "<p>Chez le comte de Vaudreuil.</p>"}, "group": "Vie – jalons majeurs", "display_date": "27 septembre selon Ubersfeld", "unique_id": "e60"}, {"start_date": {"year": 1784, "month": 4, "day": 27}, "text": {"headline": "Première publique et triomphale du Mariage de Figaro", "text": ""}, "group": "Vie – jalons majeurs", "unique_id": "e61"}, {"start_date": {"year": 1785, "month": 3, "day": 2}, "text": {"headline": "Une lettre au Journal de Paris provoque la colère du roi", "text": "<p>L'allusion aux « lions et tigres » qu'il a dû vaincre pour faire jouer sa pièce est mal reçue.</p>"}, "group": "Vie – jalons majeurs", "display_date": "2-6 mars 1785", "unique_id": "e62"}, {"start_date": {"year": 1785, "month": 3, "day": 8}, "text": {"headline": "Beaumarchais arrêté et enfermé à Saint-Lazare", "text": ""}, "group": "Vie – jalons majeurs", "display_date": "8-13 mars 1785", "unique_id": "e63"}, {"start_date": {"year": 1785, "month": 6, "day": 3}, "text": {"headline": "Suppression de l'édition de Kehl des œuvres de Voltaire", "text": "<p>Un arrêt du Conseil d'État du roi ordonne la suppression des trente volumes déjà parus.</p>"}, "group": "Vie – jalons majeurs", "unique_id": "e64"}, {"start_date": {"year": 1786, "month": 3, "day": 8}, "text": {"headline": "Mariage avec Marie-Thérèse de Willermaulaz", "text": "<p>Ils vivaient ensemble depuis douze ans.</p>"}, "group": "Vie – jalons majeurs", "unique_id": "e65"}, {"start_date": {"year": 1787, "month": 2}, "text": {"headline": "Mort de Vergennes", "text": "<p>Un des plus sûrs appuis de Beaumarchais disparaît.</p>"}, "group": "Vie – jalons majeurs", "display_date": "Février 1787", "unique_id": "e66"}, {"start_date": {"year": 1787, "month": 2, "day": 20}, "text": {"headline": "Début de la guerre de libelles avec Kornman et Bergasse", "text": "<p>Elle durera jusqu'au printemps 1789.</p>"}, "group": "Vie – jalons majeurs", "unique_id": "e67"}, {"start_date": {"year": 1787, "month": 6, "day": 8}, "text": {"headline": "Première de Tarare", "text": ""}, "group": "Vie – jalons majeurs", "unique_id": "e68"}, {"start_date": {"year": 1787, "month": 6, "day": 26}, "text": {"headline": "Achat du terrain près de la Bastille", "text": "<p>Beaumarchais y fera construire par l'architecte Lemoyne une somptueuse demeure.</p>"}, "group": "Vie – jalons majeurs", "unique_id": "e69"}, {"start_date": {"year": 1788, "month": 6}, "text": {"headline": "Plainte en diffamation dans l'affaire Kornman", "text": "<p>Beaumarchais publie son Court mémoire, qui inclut ses Idées élémentaires de 1774.</p>"}, "group": "Vie – jalons majeurs", "display_date": "Juin 1788", "unique_id": "e70"}, {"start_date": {"year": 1789, "month": 7, "day": 15}, "text": {"headline": "Beaumarchais participe à la prise de la Bastille", "text": "<p>Il y pénètre avec vingt-quatre hommes en armes, un jour après la prise de la forteresse par le peuple parisien.</p>"}, "group": "Vie – jalons majeurs", "unique_id": "e71"}, {"start_date": {"year": 1789, "month": 8, "day": 12}, "text": {"headline": "Exclu de l'Assemblée des représentants", "text": "<p>À la suite d'une dénonciation, Beaumarchais est exclu de l'Assemblée des représentants de la Commune de Paris.</p>"}, "group": "Vie – jalons majeurs", "unique_id": "e72"}, {"start_date": {"year": 1789, "month": 9, "day": 15}, "text": {"headline": "Réhabilité, invité à reprendre sa place", "text": "<p>Après sa Requête aux représentants de la commune, Beaumarchais est invité à reprendre sa place à l'Assemblée.</p>"}, "group": "Vie – jalons majeurs", "unique_id": "e73"}, {"start_date": {"year": 1791, "month": 11}, "text": {"headline": "Premières inquiétudes autour d'un achat d'armes", "text": "<p>Alerté par son associé La Hogue, Beaumarchais commence à s'inquiéter d'un achat d'armes qui manquent cruellement à la France : prémices de l'affaire des fusils de Hollande.</p>"}, "group": "Vie – jalons majeurs", "display_date": "Novembre 1791", "unique_id": "e74"}, {"start_date": {"year": 1792, "month": 3}, "text": {"headline": "Début de l'affaire des fusils de Hollande", "text": "<p>Le libraire bruxellois Delahaye propose à Beaumarchais l'achat d'armes ; un marché est conclu le 16 mars.</p>"}, "group": "Vie – jalons majeurs", "display_date": "Début mars 1792", "unique_id": "e75"}, {"start_date": {"year": 1792, "month": 4, "day": 3}, "text": {"headline": "Signature du « traité des fusils »", "text": "<p>Beaumarchais signe avec Pierre Marie, marquis de Graves, ministre de la Guerre, le traité organisant l'achat des fusils de Hollande.</p>"}, "group": "Vie – jalons majeurs", "unique_id": "e76"}, {"start_date": {"year": 1792, "month": 6, "day": 4}, "text": {"headline": "Dénoncé à l'Assemblée comme accapareur d'armes", "text": "<p>Il est dénoncé à l'Assemblée nationale le 4 juin ; il répond le 7 à son accusateur, le député François Chabot.</p>"}, "group": "Vie – jalons majeurs", "display_date": "4-7 juin 1792", "unique_id": "e77"}, {"start_date": {"year": 1792, "month": 8, "day": 23}, "text": {"headline": "Arrêté, emprisonné, délivré : échappe aux massacres de septembre", "text": "<p>Arrêté chez lui le 23 août, conduit à l'Abbaye le 27, il est délivré le 29 par Manuel, grâce notamment à l'intervention de Mme de La Marinaie — échappant ainsi aux massacres de septembre.</p>"}, "group": "Vie – jalons majeurs", "display_date": "23-29 août 1792", "unique_id": "e78"}, {"start_date": {"year": 1792, "month": 9, "day": 18}, "text": {"headline": "Quitte la France", "text": "<p>Il obtient un passeport (18) et une attestation de civisme (19), quitte la France et arrive au Havre le 22.</p>"}, "group": "Vie – jalons majeurs", "display_date": "18-22 septembre 1792", "unique_id": "e79"}, {"start_date": {"year": 1792, "month": 11, "day": 23}, "text": {"headline": "Décrété d'accusation par la Convention", "text": "<p>Sur dénonciation de Laurent Lecointre, Beaumarchais est décrété d'accusation ; les scellés sont posés chez lui fin novembre.</p>"}, "group": "Vie – jalons majeurs", "unique_id": "e80"}, {"start_date": {"year": 1792, "month": 12}, "text": {"headline": "Incarcéré à Londres pour dettes", "text": "<p>De retour à Londres, il est incarcéré à la prison du Ban du roi pour dettes.</p>"}, "group": "Vie – jalons majeurs", "display_date": "Fin décembre 1792", "unique_id": "e81"}, {"start_date": {"year": 1793, "month": 2}, "text": {"headline": "Décret d'accusation suspendu, retour à Paris", "text": "<p>Le décret d'accusation est suspendu le 10, les scellés levés le 14 ; Beaumarchais rentre à Paris le 26, après avoir payé rançon à Londres.</p>"}, "group": "Vie – jalons majeurs", "display_date": "Février 1793", "unique_id": "e82"}, {"start_date": {"year": 1793, "month": 5}, "text": {"headline": "Reconnu innocent par le Comité de salut public", "text": "<p>Il comparaît devant le Comité de salut public et est reconnu innocent le 7 ; à nouveau chargé d'acheter les armes de Hollande, il obtient son passeport le 25.</p>"}, "group": "Vie – jalons majeurs", "display_date": "Mai 1793", "unique_id": "e83"}, {"start_date": {"year": 1794, "month": 3, "day": 14}, "text": {"headline": "Placé sur la liste des émigrés", "text": "<p>L'arrêt du Comité de salut public qui le protégeait est annulé ; Beaumarchais est placé sur la liste des émigrés.</p>"}, "group": "Vie – jalons majeurs", "unique_id": "e84"}, {"start_date": {"year": 1794, "month": 7, "day": 5}, "text": {"headline": "Sa femme, sa fille et sa sœur emprisonnées", "text": "<p>Mme de Beaumarchais, Eugénie et Julie (sa sœur) sont emprisonnées à Paris.</p>"}, "group": "Vie – jalons majeurs", "unique_id": "e85"}, {"start_date": {"year": 1794, "month": 8, "day": 8}, "text": {"headline": "Eugénie et sa mère libérées", "text": "<p>La chute de Robespierre les sauve de l'échafaud ; Julie, oubliée, reste emprisonnée quatre mois de plus.</p>"}, "group": "Vie – jalons majeurs", "unique_id": "e86"}, {"start_date": {"year": 1794, "month": 8, "day": 15}, "text": {"headline": "Mme de Beaumarchais divorce", "text": "<p>Contrainte par la loi sur les émigrés, Marie-Thérèse divorce de Beaumarchais.</p>"}, "group": "Vie – jalons majeurs", "unique_id": "e87"}, {"start_date": {"year": 1794, "month": 10}, "text": {"headline": "Réfugié en Allemagne, exil à Hambourg", "text": "<p>De Hollande, Beaumarchais se réfugie en Allemagne, où il vivra son exil, principalement à Hambourg.</p>"}, "group": "Vie – jalons majeurs", "display_date": "Octobre 1794", "unique_id": "e88"}, {"start_date": {"year": 1795, "month": 6, "day": 30}, "text": {"headline": "L'arrêté d'émigré rapporté, mais retour bloqué", "text": "<p>Le Comité de Sûreté générale rapporte l'arrêté le déclarant émigré, mais des difficultés administratives empêchent encore son retour.</p>"}, "group": "Vie – jalons majeurs", "unique_id": "e89"}, {"start_date": {"year": 1796, "month": 6}, "text": {"headline": "Définitivement rayé de la liste des émigrés", "text": "<p>Beaumarchais apprend la nouvelle dix jours plus tard et part aussitôt pour la France.</p>"}, "group": "Vie – jalons majeurs", "display_date": "Juin 1796", "unique_id": "e90"}, {"start_date": {"year": 1796, "month": 7, "day": 5}, "text": {"headline": "Retour à Paris : fin de l'exil", "text": "<p>Après être passé par Rotterdam et Anvers, Beaumarchais arrive enfin à Paris.</p>"}, "group": "Vie – jalons majeurs", "unique_id": "e91"}, {"start_date": {"year": 1797, "month": 4, "day": 30}, "text": {"headline": "Beaumarchais et Marie-Thérèse se remarient", "text": ""}, "group": "Vie – jalons majeurs", "unique_id": "e92"}, {"start_date": {"year": 1797, "month": 5, "day": 5}, "text": {"headline": "Reprise triomphale de La Mère coupable", "text": "<p>Aux Comédiens-Français ; l'auteur est acclamé.</p>"}, "group": "Vie – jalons majeurs", "unique_id": "e93"}, {"start_date": {"year": 1798, "month": 1}, "text": {"headline": "Les commissions se contredisent sur les comptes de l'affaire des fusils", "text": "<p>D'abord déclaré créancier de l'État, Beaumarchais refuse le compromis ; une nouvelle commission le déclare débiteur en avril.</p>"}, "group": "Vie – jalons majeurs", "display_date": "Janvier-avril 1798", "unique_id": "e94"}, {"start_date": {"year": 1798, "month": 5, "day": 9}, "text": {"headline": "Mort de sa sœur Julie", "text": ""}, "group": "Vie – jalons majeurs", "unique_id": "e95"}, {"start_date": {"year": 1799, "month": 5, "day": 17}, "text": {"headline": "Mort de Beaumarchais", "text": "<p>Il meurt d'apoplexie pendant son sommeil.</p>"}, "group": "Vie – jalons majeurs", "display_date": "Nuit du 17 au 18 mai 1799", "unique_id": "e96"}, {"start_date": {"year": 1722, "month": 7, "day": 13}, "text": {"headline": "Mariage des parents de Beaumarchais", "text": "<p>André-Charles Caron, maître horloger, épouse Marie-Louise Pichon.</p>"}, "group": "Vie – détails", "unique_id": "e97"}, {"start_date": {"year": 1725, "month": 2, "day": 13}, "text": {"headline": "Naissance de Marie-Josèphe Caron", "text": "<p>Future Mme Guilbert, sœur aînée de Beaumarchais.</p>"}, "group": "Vie – détails", "unique_id": "e98"}, {"start_date": {"year": 1731, "month": 1, "day": 10}, "text": {"headline": "Naissance de Marie-Louise « Lisette » Caron", "text": ""}, "group": "Vie – détails", "unique_id": "e99"}, {"start_date": {"year": 1734, "month": 3, "day": 30}, "text": {"headline": "Naissance de Madeleine-Françoise « Fanchon » Caron", "text": ""}, "group": "Vie – détails", "unique_id": "e100"}, {"start_date": {"year": 1735, "month": 12, "day": 24}, "text": {"headline": "Naissance de Marie-Julie « Bécasse » Caron", "text": ""}, "group": "Vie – détails", "unique_id": "e101"}, {"start_date": {"year": 1737}, "text": {"headline": "Naissance de Jeanne-Marguerite « Tonton » Caron", "text": "<p>Pierre-Augustin, seul garçon survivant, lui restera très attaché.</p>"}, "group": "Vie – détails", "display_date": "1737", "unique_id": "e102"}, {"start_date": {"year": 1748, "month": 11, "day": 27}, "text": {"headline": "Mariage de sa sœur Marie-Josèphe", "text": "<p>Elle épouse Louis Guilbert et part s'installer à Madrid avec Lisette.</p>"}, "group": "Vie – détails", "unique_id": "e103"}, {"start_date": {"year": 1749}, "text": {"headline": "Chassé puis pardonné par son père", "text": "<p>Il obtient son pardon après intervention d'amis de la famille.</p>"}, "group": "Vie – détails", "display_date": "Vers 1749-1750", "unique_id": "e104"}, {"start_date": {"year": 1753, "month": 11, "day": 13}, "text": {"headline": "Envoie un rapport à l'Académie des sciences", "text": "<p>Un long rapport appuyé sur des preuves matérielles incontestables pour revendiquer son invention.</p>"}, "group": "Vie – détails", "unique_id": "e105"}, {"start_date": {"year": 1755, "month": 6}, "text": {"headline": "L'Académie des sciences déclare Beaumarchais et Romilly pareillement inventeurs", "text": ""}, "group": "Vie – détails", "display_date": "Juin 1755", "unique_id": "e106"}, {"start_date": {"year": 1756, "month": 1, "day": 3}, "text": {"headline": "Mort de Franquet", "text": "<p>Les relations de Beaumarchais avec sa veuve deviennent plus intimes.</p>"}, "group": "Vie – détails", "unique_id": "e107"}, {"start_date": {"year": 1756, "month": 5, "day": 17}, "text": {"headline": "Mariage de sa sœur Madeleine-Françoise", "text": "<p>Elle épouse l'horloger Jean-Antoine Lépine, associé du père Caron.</p>"}, "group": "Vie – détails", "unique_id": "e108"}, {"start_date": {"year": 1758, "month": 8, "day": 17}, "text": {"headline": "Mort de Marie-Louise Pichon, sa mère", "text": ""}, "group": "Vie – détails", "unique_id": "e109"}, {"start_date": {"year": 1762, "month": 1}, "text": {"headline": "Achat de la charge de grand maître des Eaux et Forêts", "text": "<p>Charge qu'il doit revendre après s'être heurté à l'hostilité des autres grands maîtres.</p>"}, "group": "Vie – détails", "display_date": "Janvier 1762", "unique_id": "e110"}, {"start_date": {"year": 1763, "month": 1}, "text": {"headline": "Achat d'une maison rue de Condé", "text": "<p>Il y installera son père et ses sœurs cadettes, et y habitera jusqu'en 1773.</p>"}, "group": "Vie – détails", "display_date": "Janvier 1763", "unique_id": "e111"}, {"start_date": {"year": 1763, "month": 8}, "text": {"headline": "Achat de la charge de lieutenant général des chasses", "text": ""}, "group": "Vie – détails", "display_date": "Août 1763", "unique_id": "e112"}, {"start_date": {"year": 1766, "month": 2}, "text": {"headline": "Rupture des fiançailles avec Pauline Le Breton", "text": ""}, "group": "Vie – détails", "display_date": "Février 1766", "unique_id": "e113"}, {"start_date": {"year": 1784, "month": 8, "day": 12}, "text": {"headline": "Projet d'un institut de bienfaisance", "text": "<p>Proposé dans une lettre au Journal de Paris ; il ne verra pas le jour à Paris.</p>"}, "group": "Vie – détails", "unique_id": "e114"}, {"start_date": {"year": 1784, "month": 10, "day": 2}, "text": {"headline": "Cinquantième représentation du Mariage de Figaro", "text": "<p>Au bénéfice des mères nourrices.</p>"}, "group": "Vie – détails", "unique_id": "e115"}, {"start_date": {"year": 1785}, "text": {"headline": "Polémique avec Mirabeau au sujet de la Compagnie des Eaux", "text": ""}, "group": "Vie – détails", "display_date": "1785", "unique_id": "e116"}, {"start_date": {"year": 1785, "month": 8, "day": 19}, "text": {"headline": "Le Barbier de Séville repris à la cour", "text": "<p>Marie-Antoinette y joue le rôle de Rosine.</p>"}, "group": "Vie – détails", "unique_id": "e117"}, {"start_date": {"year": 1786, "month": 11}, "text": {"headline": "Règlement du paiement des manuscrits de Voltaire", "text": "<p>Achetés au libraire Panckoucke.</p>"}, "group": "Vie – détails", "display_date": "Novembre 1786", "unique_id": "e118"}, {"start_date": {"year": 1787}, "text": {"headline": "Début de la liaison avec Amélie Houret de La Marinaie", "text": ""}, "group": "Vie – détails", "display_date": "1787", "unique_id": "e119"}, {"start_date": {"year": 1787, "month": 7}, "text": {"headline": "Nouvelle réclamation aux Américains des sommes dues", "text": ""}, "group": "Vie – détails", "display_date": "Juillet 1787", "unique_id": "e120"}, {"start_date": {"year": 1788, "month": 8}, "text": {"headline": "Publication des Observations du sieur Bergasse", "text": "<p>Réponse au Court mémoire de Beaumarchais.</p>"}, "group": "Vie – détails", "display_date": "Août 1788", "unique_id": "e121"}, {"start_date": {"year": 1789, "month": 3}, "text": {"headline": "Publication du 3e Mémoire contre Kornman", "text": "<p>Ce mémoire est envoyé à chacun des juges de l'affaire.</p>"}, "group": "Vie – détails", "display_date": "Mars 1789", "unique_id": "e122"}, {"start_date": {"year": 1789, "month": 4, "day": 2}, "text": {"headline": "Kornman et Bergasse condamnés comme calomniateurs", "text": "<p>Un arrêt du Parlement les condamne, mais l'opinion publique reste hostile à Beaumarchais.</p>"}, "group": "Vie – détails", "unique_id": "e123"}, {"start_date": {"year": 1789, "month": 5}, "text": {"headline": "Élu président du district des Blancs-Manteaux", "text": ""}, "group": "Vie – détails", "display_date": "Printemps 1789", "unique_id": "e124"}, {"start_date": {"year": 1789, "month": 5, "day": 13}, "text": {"headline": "Signale des dégradations autour de sa nouvelle maison", "text": "<p>Lettre au lieutenant de police : on rôde autour de sa maison en construction, les portes sont placardées, des bas-reliefs cassés.</p>"}, "group": "Vie – détails", "unique_id": "e125"}, {"start_date": {"year": 1789, "month": 8, "day": 22}, "text": {"headline": "Don de 12 000 livres à son district", "text": "<p>Beaumarchais fait don de cette somme à son district, qu'il est chargé de surveiller dans la démolition de la Bastille.</p>"}, "group": "Vie – détails", "unique_id": "e126"}, {"start_date": {"year": 1789, "month": 9, "day": 2}, "text": {"headline": "Requête aux représentants de la commune de Paris", "text": "<p>Long texte où Beaumarchais réfute toutes les accusations lancées contre lui.</p>"}, "group": "Vie – détails", "unique_id": "e127"}, {"start_date": {"year": 1790}, "text": {"headline": "L'édition de Voltaire s'achève : échec financier", "text": "<p>Les soixante-dix volumes ont paru, mais seuls deux mille cinq cents souscripteurs se sont manifestés, la moitié du chiffre prévu ; les tentatives pour obtenir le paiement des créances américaines échouent.</p>"}, "group": "Vie – détails", "display_date": "1790", "unique_id": "e128"}, {"start_date": {"year": 1790, "month": 4}, "text": {"headline": "Don à l'Institut de bienfaisance maternelle de Lyon", "text": "<p>Beaumarchais envoie six mille livres à cet institut.</p>"}, "group": "Vie – détails", "display_date": "Avril 1790", "unique_id": "e129"}, {"start_date": {"year": 1790, "month": 7, "day": 14}, "text": {"headline": "Héberge huit cents fédérés de province", "text": "<p>Il refuse tout dédommagement pour cet accueil.</p>"}, "group": "Vie – détails", "unique_id": "e130"}, {"start_date": {"year": 1790, "month": 8, "day": 3}, "text": {"headline": "Reprise de Tarare", "text": "<p>Nouvelle version avec un dénouement remanié, « le Couronnement de Tarare ».</p>"}, "group": "Vie – détails", "unique_id": "e131"}, {"start_date": {"year": 1790, "month": 9}, "text": {"headline": "Réconciliation avec Mirabeau", "text": "<p>À l'occasion d'un échange de lettres pour une opération immobilière.</p>"}, "group": "Vie – détails", "display_date": "Septembre 1790", "unique_id": "e132"}, {"start_date": {"year": 1791, "month": 1, "day": 13}, "text": {"headline": "Décret protégeant les droits des auteurs dramatiques", "text": "<p>La Constituante adopte ce décret, aboutissement partiel du combat mené par Beaumarchais.</p>"}, "group": "Vie – détails", "unique_id": "e133"}, {"start_date": {"year": 1791, "month": 2}, "text": {"headline": "La Mère coupable acceptée à la Comédie-Française", "text": ""}, "group": "Vie – détails", "display_date": "Fé     };
  });

  window.timeline = new TL.Timeline('timeline-embed', timeline_json, {
    language: 'fr',
    scale_factor: 2
  });

  function findClosestEvent(targetYear) {
    var best = null, bestDist = Infinity;
    for (var i = 0; i < eventIndex.length; i++) {
      var dist = Math.abs(eventIndex[i].year - targetYear);
      if (dist < bestDist) {
        bestDist = dist;
        best = eventIndex[i];
      }
    }
    return best;
  }

  function doGoTo() {
    var input = document.getElementById('goto-year');
    var msg = document.getElementById('goto-msg');
    var year = parseInt(input.value, 10);
    if (isNaN(year)) {
      msg.textContent = 'Entrez une année valide.';
      return;
    }
    var match = findClosestEvent(year);
    if (!match) {
      msg.textContent = 'Aucun événement trouvé.';
      return;
    }
    msg.textContent = 'Événement le plus proche : ' + match.display + ' — ' + match.headline;
    try {
      if (window.timeline && typeof window.timeline.goToId === 'function') {
        window.timeline.goToId(match.id);
      }
    } catch (err) {
      console.error('goToId a échoué :', err);
    }
  }

  document.getElementById('goto-btn').addEventListener('click', doGoTo);
  document.getElementById('goto-year').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') doGoTo();
  });
</script>
</body>
</html>
